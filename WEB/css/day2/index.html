<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Property-> display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="d1">Div1</div>
        <div>Div2 </div>
        <div>Div3</div>
        <span class="s1">Span1</span>
        <span>Span2</span>
    </main>
</body>
</html>

<!-- 

    display property:

    it is used to set the elements on different order or places.

    1. display:block;

    display block changes the inline element to the block level elements.

    so by applying this property the inline element start behaving like block level element.

    2. display:inline

    display inline changes the block element to the inline elements.

    so by applying this property the block element start behaving like inline element.

    3. display: none

    this property will remove the element.

    and it will not take the w&h.

    4. display: inline-block

    this property mostly make the element behave like inline element but the html take the i property from the block, that is it take the width and height(in normal inline element dont take w&h.)

    5. display: flex

    by using this property flex the first generation child behave like a inline-block element.

    it only applied on the first generation child of parent, and this property should be given to the parent only.

    and this property can be achieved by just giving the display:inline-block to the child element, but dont get the some additional property as the display:flex gives.

    1. justify-content,
    2. align-items
    3. flex-wrap
    4. flex-direction
    

-->
