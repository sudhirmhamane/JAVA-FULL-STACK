<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./register.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Register page using Html and Css</title>
  </head>
  <body>
    <main class="h-screen w-full bg-black flex justify-center items-center">
      <main class="h-screen w-[46%] bg-white flex justify-center items-center">
        <main class="h-[85vh] w-[66%] bg-fuchsia-700">
          <section class="flex justify-center items-center h-[10vh] text-white">
            <h1 class="font-bold text-3xl">CREATE NEW ACCOUNT</h1>
          </section>
          <section class="flex flex-col justify-center items-center gap-10 pt-10">
            
            <div class="w-full">
                <input 
            
              class="border-2 font-semibold h-[6vh] w-[80%] rounded-xl"
              type="text"
              placeholder="Full Name"
            />
            </div>
            <div>
                <input
              class="border-2 font-semibold h-[6vh] w-[80%] rounded-xl"
              type="text"
              placeholder="Email"
            />
            </div>
            <div>
                <input
              class="border-2 font-semibold h-[6vh] w-[80%] rounded-xl"
              type="password"
              placeholder="Password"
            />
            </div>
            <div>
                <input
              class="border-2 font-semibold h-[6vh] w-[80%] rounded-xl"
              type="password"
              placeholder="Confirm Password"
            />
            </div>
            <div><input
              class="border-2 font-semibold h-[6vh] w-[80%] rounded-xl"
              type="tel"
              placeholder="Phone Number"
            /></div>
            

            

            

            

            
          </section>
          <section>
            <h1>Remember Me</h1>
            <h1>Subscribe to Newsletter</h1>
          </section>
          <section>
            <button>REGISTER</button>
          </section>
        </main>
      </main>
    </main>
  </body>
</html>
