<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms in html</title>
  </head>
  <body>
    <!-- FORM in HTML -->
    <!-- 
        forms are used to take the input from the user.
     -->
    <form action="">
    
        <!-- to take text input -->
      <input type="text" placeholder="enter a text" /> <br> <br>

      <!-- to select color -->
      <input type="color" /> <br> <br>

      <!-- to select only the date -->
      <input type="date" /> <br> <br>

      <!-- to select the date with time -->
      <input type="datetime-local" /> <br><br>

      <!-- to select file or documet -->
      <input type="file" /> <br> <br>

      <!-- to enter the email -->
      <input type="email" placeholder="enter email"/> <br> <br>

      <!-- hidden input -->
      <input type="hidden" /> <br> <br>

      <!-- to take the month input only -->
      <input type="month" /> <br> <br>

      <!-- to take the numbers input -->
      <input type="number" placeholder="enter any number"/> <br> <br>

      <!-- to enter the password -->
      <input type="password" placeholder="enter password"/> <br> <br>

      <!-- to get the search option -->
      <input type="search" placeholder="search here"/> <br> <br>

      <!-- to take the telephonic input -->
      <input type="tel" placeholder="enter phone number"/> <br> <br>

      <!-- to take the time input only -->
      <input type="time" /> <br> <br>

      <!-- to take the url as input -->
      <input type="url" /> <br> <br>
      <input type="week"/>

      <button>Click</button>
    </form>

    <!-- range -> used for range selection -->
    <form action="">
        <input type="range" min="0" max="100" step="20">
    </form>


  </body>
</html>
