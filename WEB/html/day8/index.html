    <form>
        <!-- placeholder -->
        <input type="text" placeholder="enter your name">

        <!-- value -->
        <input type="text" value="+91">

        <!-- readonly -->
        <input type="text" value="i accept T&C" readonly>

        <!-- disabled -->
        <button disabled>Submit</button>

        <!-- checked -->
        <input type="checkbox" checked> 

        <!-- autofocus -->
        <input type="text" >
        <input type="text" autofocus>
        <input type="text">

        <!-- accesskey -> it is used to access any field by using the key combination (alt + accesskey)-->
        
        <input type="text" placeholder="username" accesskey="a">

        <!-- draggable-> by giving this attributes we can enable drag option  -->
        <input type="text" draggable="">

        <!-- minlength -> by using this we set the field input minimum length, for ex ml is 10 so user should enter min 10 values then only we can move to next -->
        <input type="text" minlength="10">

        <!-- maxlength -> for this attribute user should be enter maximum 10 values otherwise not go ahead. -->
        <input type="text" maxlength="10">

        <!-- required -> it make the field mandatory to give the values. -->
        <!-- <input type="text" placeholder="username" required> -->
        <button>submit</button>

        <!-- role -> we specify what purpose this tag is used. -->
        <div role="button">Submit</div>

        <!-- action, method -->
         <form action="https://www.google.com" method="get">

            <input type="text" name="ussername">
            <input type="password" placeholder="password">
            <button>click</button>
         </form>

    </form>
